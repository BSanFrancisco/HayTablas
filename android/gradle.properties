org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Volvimos a AGP 8.13 (ver android/settings.gradle.kts y
# android/app/build.gradle.kts). AGP 8.x no tiene el modo "Kotlin
# built-in" que trajo AGP 9, así que estas dos propiedades ya no hacen
# falta: el plugin "org.jetbrains.kotlin.android" (aplicado en
# android/app/build.gradle.kts) es, de nuevo, la forma normal y
# soportada de compilar Kotlin, y no choca con shared_preferences ni
# con ningún otro plugin de pub.dev.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
